name: Pivot Scanner

on:
  schedule:
    - cron: '*/30 * * * *'   # tiap 30 menit (waktu UTC; GitHub tidak jamin presisi persis, kadang telat beberapa menit)
  workflow_dispatch:          # supaya bisa dipicu manual lewat tombol "Run workflow" di app/web GitHub

permissions:
  contents: write            # perlu ini supaya job bisa commit & push hasil scan balik ke repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit and push results
        run: |
          git config user.name "pivot-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/events_log.jsonl data/state.json
          git diff --quiet --cached || git commit -m "Update scan results"
          git push
